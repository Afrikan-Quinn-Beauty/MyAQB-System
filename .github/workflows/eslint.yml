
name: AQB JavaScript Quality Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install ESLint
        run: npm install --no-save eslint @eslint/js

      - name: Run AQB code quality checks
        run: npx eslint --config eslint.config.mjs --ext .js,.gs .
